<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Avatar Spike</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; }
    canvas { display: block; }
    #status {
      position: absolute; top: 8px; left: 8px; color: #cdd6f4;
      font-family: sans-serif; font-size: 13px; z-index: 10;
    }
  </style>
</head>
<body>
  <div id="status">Cargando avatar...</div>

  <script type="importmap">
  {
    "imports": {
      "three": "./lib/three/build/three.module.js",
      "three/addons/": "./lib/three/jsm/",
      "@pixiv/three-vrm": "./lib/three-vrm/three-vrm.module.min.js"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

    const statusEl = document.getElementById('status');

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const camera = new THREE.PerspectiveCamera(30.0, window.innerWidth / window.innerHeight, 0.1, 20.0);
    camera.position.set(0.0, 1.3, 3.0);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.screenSpacePanning = true;
    controls.target.set(0.0, 1.0, 0.0);
    controls.update();

    const scene = new THREE.Scene();

    const light = new THREE.DirectionalLight(0xffffff, Math.PI);
    light.position.set(1.0, 1.0, 1.0).normalize();
    scene.add(light);
    scene.add(new THREE.AmbientLight(0xffffff, 0.6));

    let currentVrm = undefined;
    const loader = new GLTFLoader();
    loader.crossOrigin = 'anonymous';
    loader.register((parser) => new VRMLoaderPlugin(parser));

    loader.load(
      './models/sample.vrm',
      (gltf) => {
        const vrm = gltf.userData.vrm;

        VRMUtils.removeUnnecessaryVertices(gltf.scene);
        VRMUtils.removeUnnecessaryJoints(gltf.scene);

        vrm.scene.traverse((obj) => { obj.frustumCulled = false; });

        currentVrm = vrm;
        scene.add(vrm.scene);
        statusEl.textContent = 'Avatar cargado — arrastrá para rotar la cámara.';
        setTimeout(() => { statusEl.style.display = 'none'; }, 3000);
      },
      (progress) => {
        if (progress.total) {
          statusEl.textContent = `Cargando avatar... ${Math.round(100 * progress.loaded / progress.total)}%`;
        }
      },
      (error) => {
        statusEl.textContent = 'Error cargando el avatar: ' + error.message;
        console.error(error);
      }
    );

    const clock = new THREE.Clock();
    clock.start();

    function animate() {
      requestAnimationFrame(animate);

      if (currentVrm) {
        currentVrm.update(clock.getDelta());

        // Idle simple: la cabeza sigue un leve vaivén senoidal para probar
        // que también se puede animar el esqueleto, no solo cargarlo estático.
        const head = currentVrm.humanoid?.getNormalizedBoneNode('head');
        if (head) {
          const t = clock.getElapsedTime();
          head.rotation.y = Math.sin(t * 0.6) * 0.15;
          head.rotation.x = Math.sin(t * 0.4) * 0.05;
        }
      }

      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
