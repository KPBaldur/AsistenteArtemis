# Escritura diaria minima en Supabase para que el plan gratuito no pause el
# proyecto por inactividad (abrir una conexion no cuenta como actividad).
# Usa el rol keepalive_bot (solo UPDATE sobre la tabla keepalive, migracion
# 0003 del Brain). La URL de conexion vive solo en el secret
# SUPABASE_KEEPALIVE_URL. Si el UPDATE no toca la fila, el job falla y GitHub
# avisa por correo.
name: Supabase keepalive

on:
  schedule:
    - cron: "17 12 * * *" # diario, 12:17 UTC (09:17 en Chile)
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: UPDATE keepalive
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_KEEPALIVE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Falta el secret SUPABASE_KEEPALIVE_URL"
            exit 1
          fi
          out=$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -tA \
            -c "UPDATE public.keepalive SET last_ping = now() WHERE id = 1 RETURNING id")
          echo "$out"
          if ! echo "$out" | grep -qx "1"; then
            echo "::error::El UPDATE no actualizo la fila de keepalive"
            exit 1
          fi
